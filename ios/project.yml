name: PedalLoop
options:
  bundleIdPrefix: com.pedalloop
  deploymentTarget:
    iOS: "17.0"
packages:
  PedalCore:
    path: .
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(PEDAL_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
targets:
  PedalLoop:
    type: application
    platform: iOS
    sources:
      - path: PedalLoop
    dependencies:
      - package: PedalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedalloop.mobile.beta
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PedalLoop/Info.plist
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: true
