services:
  pedal-loop:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PUBLIC_ORIGIN: "http://127.0.0.1:8000"
      ALLOW_IMPORTS: "0"
      DATA_DIR: "/app/storage"
      STAGING_USER: "${STAGING_USER:-}"
      STAGING_PASSWORD: "${STAGING_PASSWORD:-}"
    volumes:
      - road-data:/app/storage
    restart: unless-stopped
volumes:
  road-data:
